plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cwr.poseidon'
    compileSdk 34

    defaultConfig {
        applicationId "com.cwr.poseidon"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        
        buildToolsVersion "34.0.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DCMAKE_BUILD_TYPE=RelWithDebInfo", "-DCMAKE_POLICY_VERSION_MINIMUM=3.5", "-DCMAKE_TOOLCHAIN_FILE=${project.rootDir}/../vcpkg/scripts/buildsystems/vcpkg.cmake", "-DVCPKG_TARGET_TRIPLET=arm64-android", "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${System.getenv('ANDROID_NDK_ROOT')}/build/cmake/android.toolchain.cmake", "-DVCPKG_OVERLAY_PORTS=${project.rootDir}/../vcpkg-overlay-ports", "-DCMAKE_CXX_SCAN_FOR_MODULES=OFF"
                cppFlags "-std=c++20"
            }
        }
        ndk {
            abiFilters "arm64-v8a"
        }
    }
    
    // Set ndkPath from Nix-provided environment variable since Nix puts it in ndk-bundle
    ndkPath System.getenv("ANDROID_NDK_ROOT") ?: ""

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.25.0+"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // SDL3 handles its own Java wrapper via SDLActivity, which vcpkg or SDL provides.
    // For a manual CMake integration, we usually copy SDLActivity.java into src/main/java
}
