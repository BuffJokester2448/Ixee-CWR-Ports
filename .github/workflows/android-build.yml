name: Android CI

on:
  push:
    branches: [ "port/android-arm64", "main" ]
  pull_request:
    branches: [ "port/android-arm64", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'c8f45a069ad0266bc70e703c1252cb51506ddcaf' # Usually good to pin, but this action handles caching well
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: '**/vcpkg.json'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK (Debug)
        working-directory: android
        run: gradle assembleDebug

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/port/android-arm64'
        with:
          tag_name: android-latest
          name: "Latest Android Build"
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
